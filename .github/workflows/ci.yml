name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo build
      - run: cargo clippy -- -D warnings
      - run: cargo fmt --check

  # Regenerates the Lean translation with Charon and Aeneas and fails if it differs from the
  # committed `lean/DoubleAndAdd.lean`, so the proofs never describe stale code.
  translation-up-to-date:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-substituters = https://hacl.cachix.org
            extra-trusted-public-keys = hacl.cachix.org-1:FzsZ2xsByOwKwIWNPII7yMOelJNDZ12mDAj3d1eGX0c=
      # Use the same Aeneas commit as the Lean library pinned in the Lake manifest.
      - name: Build Charon and Aeneas
        run: |
          rev=$(jq -r '.packages[] | select(.name == "aeneas") | .rev' lean/lake-manifest.json)
          nix build -L "github:AeneasVerif/aeneas/$rev#aeneas" -o "$RUNNER_TEMP/aeneas"
      - name: Regenerate the Lean translation
        run: |
          "$RUNNER_TEMP/aeneas/bin/charon" cargo --preset=aeneas --dest-file "$RUNNER_TEMP/double_and_add.llbc"
          "$RUNNER_TEMP/aeneas/bin/aeneas" -backend lean -dest lean "$RUNNER_TEMP/double_and_add.llbc"
      - name: Check the translation is unchanged
        run: |
          if ! git diff --exit-code lean/DoubleAndAdd.lean; then
            echo "::error file=lean/DoubleAndAdd.lean,title=Lean translation out of date::lean/DoubleAndAdd.lean does not match src/lib.rs. Regenerate it with Charon and Aeneas at the commit pinned in lean/lake-manifest.json and commit the result."
            exit 1
          fi

  # Builds the specs in `lean/DoubleAndAddSpec.lean`, which also checks their axioms. Lean errors
  # are reported as annotations on the failing line.
  proofs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Lean and fetch the Mathlib cache
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          build: false
      - name: Check the proofs
        working-directory: lean
        run: |
          set -o pipefail
          lake build 2>&1 | tee "$RUNNER_TEMP/build.log" || {
            sed -nE 's|^error: ([^ :]+\.lean):([0-9]+):([0-9]+): (.*)$|::error file=lean/\1,line=\2,col=\3,title=Proof failed::\4|p' \
              "$RUNNER_TEMP/build.log"
            exit 1
          }
