name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo build
      - run: cargo clippy -- -D warnings
      - run: cargo fmt --check

  # Regenerates the Lean translation with Charon and Aeneas and fails if it differs from the
  # committed `lean/DoubleAndAdd.lean`, so the proofs never describe stale code.
  translation-up-to-date:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-substituters = https://hacl.cachix.org
            extra-trusted-public-keys = hacl.cachix.org-1:FzsZ2xsByOwKwIWNPII7yMOelJNDZ12mDAj3d1eGX0c=
      # Use the same Aeneas commit as the Lean library pinned in the Lake manifest.
      - name: Build Charon and Aeneas
        run: |
          rev=$(jq -r '.packages[] | select(.name == "aeneas") | .rev' lean/lake-manifest.json)
          nix build -L "github:AeneasVerif/aeneas/$rev#aeneas" -o "$RUNNER_TEMP/aeneas"
      - name: Regenerate the Lean translation
        run: |
          "$RUNNER_TEMP/aeneas/bin/charon" cargo --preset=aeneas --dest-file "$RUNNER_TEMP/double_and_add.llbc"
          "$RUNNER_TEMP/aeneas/bin/aeneas" -backend lean -dest lean "$RUNNER_TEMP/double_and_add.llbc"
      - name: Check the translation is unchanged
        run: git diff --exit-code lean/DoubleAndAdd.lean

  proofs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Lean and fetch the Mathlib cache
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          build: false
      - name: Build the hand-written translation and its correctness proof
        working-directory: lean
        run: lake build DoubleAndAddTranslation
      # The only proof that depends on the shape of the Aeneas translation. It fails exactly when the
      # Rust code no longer matches the hand-written translation in `DoubleAndAddTranslation.lean`.
      - name: Check the Aeneas translation is equivalent to the hand-written one
        working-directory: lean
        run: |
          if ! lake build DoubleAndAddEquiv; then
            echo "::error file=lean/DoubleAndAddEquiv.lean,title=Translations not equivalent::The Aeneas translation of src/lib.rs (lean/DoubleAndAdd.lean) can no longer be proven equivalent to the hand-written translation in lean/DoubleAndAddTranslation.lean. Update the hand-written translation to match the Rust code."
            exit 1
          fi
      - name: Build the remaining proofs
        working-directory: lean
        run: lake build
      # `sorry` is only a warning, so check explicitly that the main theorems depend only on the
      # allowed axioms listed in `CheckAxioms.lean`. This also rules out `sorry` and `axiom`.
      - name: Check axioms
        working-directory: lean
        run: lake env lean CheckAxioms.lean
